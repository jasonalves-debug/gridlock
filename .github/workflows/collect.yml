name: Collect GRIDLOCK data

# GitHub's scheduler only fires every few hours in practice, so each run keeps going for ~5.3 hours
# (collect/loop.sh); the schedule queues the next one so collection runs around the clock.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      static:
        description: 'Rebuild the daily data (timetables, cameras...) right away'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-int8
      - name: Voice tools (Kokoro TTS for the news bulletin)
        run: pip install --quiet kokoro-onnx lameenc || echo "::warning::voice tools did not install; the bulletin will use the phone's voice"
      - name: Collect every 2.5 minutes
        env:
          ONTARIO511_KEY: ${{ secrets.ONTARIO511_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          FORCE_STATIC: ${{ inputs.static && '1' || '' }}
        run: bash collect/loop.sh
